<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ErgoSense AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
<style>
:root{--bg:#F4F7FA;--surface:#FFFFFF;--surface-2:#EEF3F7;--ink:#0F1C2B;--ink-2:#465668;--ink-3:#76858F;--line:#E1E8EF;
--brand:#0A7C86;--brand-ink:#065A62;--brand-soft:#DDF1F2;--blue:#2E6BD8;--blue-soft:#E4EDFB;
--good:#12946A;--good-soft:#DFF3EA;--warn:#C97A06;--warn-soft:#FCEFD6;--bad:#CC3E37;--bad-soft:#FBE5E3;
--tt:#0F1C2B;--shadow:0 1px 2px rgba(15,28,43,.05),0 10px 24px -14px rgba(15,28,43,.18);--shadow-lg:0 24px 60px -20px rgba(15,28,43,.35);
--f-head:'Manrope','Segoe UI',system-ui,sans-serif;--f-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1118;--surface:#111B25;--surface-2:#182531;--ink:#E8EEF4;--ink-2:#A6B4C2;--ink-3:#78899A;--line:#223141;
--brand:#3CC1CC;--brand-ink:#7FDDE5;--brand-soft:#0F3A40;--blue:#6C9BFF;--blue-soft:#15284A;--good:#3DD39F;--good-soft:#0F3527;--warn:#F0AE3C;--warn-soft:#3B2C0D;--bad:#FF7A72;--bad-soft:#43181A;--tt:#000;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1118;--surface:#111B25;--surface-2:#182531;--ink:#E8EEF4;--ink-2:#A6B4C2;--ink-3:#78899A;--line:#223141;
--brand:#3CC1CC;--brand-ink:#7FDDE5;--brand-soft:#0F3A40;--blue:#6C9BFF;--blue-soft:#15284A;--good:#3DD39F;--good-soft:#0F3527;--warn:#F0AE3C;--warn-soft:#3B2C0D;--bad:#FF7A72;--bad-soft:#43181A;--tt:#000;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -14px rgba(0,0,0,.6);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4,.num{font-family:var(--f-head);letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
svg{display:block;max-width:100%}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}
.brand{display:flex;gap:11px;align-items:center;padding:20px 20px 14px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.brand b{font:800 17px var(--f-head);letter-spacing:-.02em;display:block;line-height:1.1}
.brand small{color:var(--ink-3);font-size:11.5px}
.nav{flex:1;overflow:auto;padding:4px 12px 12px}
.nav h6{margin:14px 10px 6px;font:600 12px var(--f-body);color:var(--ink-3)}
.nav-i{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border-radius:11px;color:var(--ink-2);font-weight:550;text-align:left;position:relative;transition:background .15s,color .15s}
.nav-i:hover{background:var(--surface-2);color:var(--ink)}
.nav-i.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:700}
.nav-i.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--brand)}
.nav-i .badge{margin-left:auto;background:var(--brand);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.profile{border-top:1px solid var(--line);padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font:800 14px var(--f-head);grid-row:span 2}
.profile b{font-weight:700;line-height:1.2}.profile small{color:var(--ink-3)}
.pscore{grid-column:1/-1;margin-top:8px;font-size:12px;color:var(--ink-2)}
.pscore .bar{margin-top:5px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:inherit;opacity:.35;animation:pulse 2s ease-out infinite}
.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.off{background:var(--ink-3)}.dot.off::after{display:none}
@keyframes pulse{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1.8);opacity:0}}
.ib{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);position:relative;transition:background .15s}
.ib:hover{background:var(--surface-2)}
.ib .n{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-size:10.5px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;font-weight:700}
.menu-b{display:none}
.page{padding:26px 28px 24px;max-width:1440px;width:100%;margin:0 auto;flex:1}
.ph{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:28px;font-weight:800;line-height:1.15}
.ph p{color:var(--ink-2);margin-top:6px;max-width:640px}
.ph .act{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;font-weight:650;background:var(--surface);border:1px solid var(--line);color:var(--ink);transition:transform .12s,background .15s,box-shadow .15s}
.btn:hover{background:var(--surface-2)}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-ink)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.55;pointer-events:none}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{padding:6px 13px;border-radius:9px;font-weight:600;color:var(--ink-2);white-space:nowrap;font-size:13px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card.soft{background:var(--surface-2);box-shadow:none}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ch h3{font-size:16px;font-weight:750}
.ch p{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.sec{margin:30px 0 14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec h2{font-size:19px;font-weight:780}.sec p{color:var(--ink-3);font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g-21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}.g-12{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}.g-11{grid-template-columns:repeat(2,minmax(0,1fr))}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:650;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.brand{background:var(--brand-soft);color:var(--brand-ink)}.chip.blue{background:var(--blue-soft);color:var(--blue)}
.muted{color:var(--ink-3)}.tiny{font-size:12px}.b{font-weight:700}
.bar{height:7px;background:var(--surface-2);border-radius:9px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .8s cubic-bezier(.3,.7,.2,1)}
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.status{position:relative;overflow:hidden}
.status .big{font:800 44px/1 var(--f-head);color:var(--good);display:flex;align-items:center;gap:14px;letter-spacing:-.03em}
.status .facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px;margin-top:20px}
.status .facts small{display:block;color:var(--ink-3);font-size:12px}
.status .facts b{font:700 16px var(--f-head)}
.greet h1{font-size:32px;font-weight:800}
.kpi{cursor:pointer;transition:transform .15s,border-color .15s;display:flex;flex-direction:column;gap:6px;padding:16px}
.kpi:hover{transform:translateY(-2px);border-color:var(--brand)}
.kpi .l{color:var(--ink-2);font-weight:600;font-size:13px}
.kpi .v{font:800 28px/1.1 var(--f-head);letter-spacing:-.02em}
.kpi .v small{font-size:14px;color:var(--ink-3);font-weight:600;margin-left:2px}
.kpi .spark{height:30px;width:100%}
.kpi .cmp{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.split{display:flex;gap:16px;align-items:center}
.cat-list{display:grid;gap:4px;flex:1;min-width:0}
.cat{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;width:100%;text-align:left;transition:background .15s}
.cat:hover,.cat.on{background:var(--surface-2)}
.cat .sw{width:10px;height:10px;border-radius:3px;flex:none}.cat .n{flex:1;font-weight:600}.cat .p{font-weight:700}
.donut{position:relative;flex:none}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut .mid b{font:800 30px var(--f-head)}.donut .mid small{color:var(--ink-3)}
.donut circle{cursor:pointer;transition:stroke-width .2s,opacity .2s}
.detail{margin-top:14px;padding:14px 16px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);animation:fadein .3s}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
details.fx{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
details.fx+details.fx{margin-top:10px}
details.fx summary{list-style:none;display:flex;gap:14px;align-items:center;padding:14px 16px;cursor:pointer}
details.fx summary::-webkit-details-marker{display:none}
details.fx summary:hover{background:var(--surface-2)}
details.fx .chev{margin-left:auto;transition:transform .2s;color:var(--ink-3)}
details.fx[open] .chev{transform:rotate(90deg)}
details.fx .body{padding:2px 16px 16px 16px;animation:fadein .25s}
.fx-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:8px 0 12px}
.kv small{display:block;color:var(--ink-3);font-size:12px}.kv b{font-weight:700}
.reco{background:var(--brand-soft);color:var(--ink);border-radius:11px;padding:11px 13px;display:flex;gap:10px;align-items:flex-start}
.reco .ico{color:var(--brand-ink);margin-top:2px}
.insight{position:relative;display:flex;flex-direction:column;gap:10px}
.ai-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--blue)}
.compare{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.6fr);gap:16px}
.flowrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step{padding:8px 13px;border-radius:10px;font-weight:650;background:var(--surface-2);color:var(--ink-2)}
.step.hi{background:var(--brand);color:#fff}
.arrow{color:var(--ink-3)}
.chart{position:relative;width:100%}
.tt{position:absolute;pointer-events:none;background:var(--tt);color:#fff;padding:10px 12px;border-radius:11px;font-size:12.5px;line-height:1.5;min-width:170px;max-width:270px;opacity:0;transition:opacity .12s;z-index:5;box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.08)}
.tt b{font-weight:700}.tt .r{display:flex;justify-content:space-between;gap:14px;color:#C9D4DF}.tt .r span:last-child{color:#fff;font-weight:600}
.axis text{font:11px var(--f-body);fill:var(--ink-3)}
.grid-l{stroke:var(--line);stroke-width:1}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.4,.1,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.grow-y{transform-box:fill-box;transform-origin:bottom;animation:growy .8s cubic-bezier(.3,.7,.2,1) both}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.heat{display:grid;gap:3px}
.heat .c{height:26px;border-radius:6px;display:grid;place-items:center;font-size:11px;color:#fff;font-weight:700}
.heat .lab{font-size:12px;color:var(--ink-3);display:flex;align-items:center}
.fig{width:100%;height:auto;max-height:420px;--fig:var(--brand)}
.fig .fl{stroke:var(--line);stroke-width:2}
.fig .fu{stroke:var(--ink-3);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.fig .fb{stroke:var(--fig);stroke-width:10;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .5s}
.fig .fh{fill:var(--surface);stroke:var(--fig);stroke-width:5;transition:stroke .5s}
.fig .fj{fill:var(--surface);stroke:var(--fig);stroke-width:3}
.fig .fscr{fill:var(--ink);opacity:.85}
.fig .fdash{stroke:var(--brand);stroke-width:1.5;stroke-dasharray:4 5;fill:none}
.fig text{font:600 11px var(--f-body);fill:var(--ink-3)}
.f-torso,.f-head,.f-mon{transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.metric{display:flex;flex-direction:column;gap:2px;padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--surface)}
.metric small{color:var(--ink-3);font-size:12px}.metric b{font:800 22px var(--f-head)}
.feed{display:grid;gap:0;max-height:300px;overflow:auto}
.feed div{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;animation:fadein .3s}
.feed time{color:var(--ink-3);font-variant-numeric:tabular-nums}
.banner{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-radius:13px;background:var(--warn-soft);color:var(--ink);margin-bottom:16px;border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner .ico{color:var(--warn);margin-top:2px}
.empty{display:grid;place-items:center;text-align:center;padding:44px 20px;gap:10px;border:1.5px dashed var(--line);border-radius:16px;background:var(--surface)}
.empty .eic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-ink)}
.empty .eic.warn{background:var(--warn-soft);color:var(--warn)}.empty .eic.good{background:var(--good-soft);color:var(--good)}
.empty h3{font-size:17px}.empty p{color:var(--ink-2);max-width:420px}
.skel{border-radius:14px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:sh 1.3s ease infinite}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--brand);animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.tgl{width:40px;height:23px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tgl.on{background:var(--brand)}.tgl.on::after{transform:translateX(17px)}.tgl.lock{opacity:.6;pointer-events:none}
.row{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row p{color:var(--ink-3);font-size:12.5px}
.prio{font-size:12px;font-weight:750;padding:3px 10px;border-radius:99px}
.prio.high{background:var(--bad-soft);color:var(--bad)}.prio.med{background:var(--warn-soft);color:var(--warn)}.prio.low{background:var(--blue-soft);color:var(--blue)}
.rec{display:grid;gap:12px}
.rec.done{opacity:.62}
.rec .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.rec .meta small{color:var(--ink-3);display:block;font-size:12px}
.xai{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:6px}
.xai div{background:var(--surface-2);border-radius:12px;padding:12px}
.xai b{display:block;font:700 12.5px var(--f-head);color:var(--brand-ink);margin-bottom:3px}
.day{display:flex;flex-direction:column;gap:10px}
.day.today{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft),var(--shadow)}
.task{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:8px 10px;border-radius:10px;transition:background .15s}
.task:hover{background:var(--surface-2)}
.task small{display:block;color:var(--ink-3);font-size:11.5px}
.cb{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;margin-top:1px;color:#fff;transition:all .15s}
.task.on .cb{background:var(--brand);border-color:var(--brand)}.task.on span{text-decoration:line-through;color:var(--ink-3)}
.movement-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.move-card{display:flex;flex-direction:column;gap:12px}
.move-figure{height:190px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;padding:6px 8px}
.move-svg{width:100%;height:180px;max-width:250px}
.move-svg .stick{stroke:var(--brand);stroke-width:4.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.move-svg .head{fill:var(--surface);stroke:var(--brand);stroke-width:3.2}
.move-svg .joint{fill:var(--surface);stroke:var(--brand);stroke-width:2.8}
.move-svg .guide{stroke:var(--line);stroke-width:1.5;fill:none;stroke-dasharray:4 5}
.move-svg .divider{stroke:var(--line);stroke-width:1}
.move-svg .arrow{stroke:var(--brand);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.move-svg .pose-a{transform-box:fill-box;transform-origin:center;animation:poseA 3.2s ease-in-out infinite}
.move-svg .pose-b{transform-box:fill-box;transform-origin:center;animation:poseB 3.2s ease-in-out infinite}
.move-svg .wrist-a{transform-box:fill-box;transform-origin:center;animation:wristA 2.8s ease-in-out infinite}
.move-svg .wrist-b{transform-box:fill-box;transform-origin:center;animation:wristB 2.8s ease-in-out infinite}
.move-svg .walk-b{transform-box:fill-box;transform-origin:center;animation:walkB 2.2s ease-in-out infinite}
@keyframes poseA{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}
